# Grouped so a weekly run opens a handful of pull requests, not forty.
# Every manifest in the repository is listed; add one here when a new one appears.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      root-and-workspaces:
        patterns: ["*"]

  # The Expo and React Native toolchain is deliberately excluded, not grouped.
  # Its version is entangled with the client work in flight, and an SDK upgrade
  # is a deliberate change someone owns rather than an automated batch. Drop the
  # ignore block when Phase 1 settles and someone takes the upgrade.
  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: expo
      - dependency-name: expo-*
      - dependency-name: "@expo/*"
      - dependency-name: react-native
      - dependency-name: react-native-*
      - dependency-name: "@react-native/*"
      - dependency-name: metro
      - dependency-name: metro-*
    groups:
      all:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /marketing
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      all:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /contracts
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      all:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      all:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      all:
        patterns: ["*"]
