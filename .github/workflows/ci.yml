name: CI

on:
  push:
    branches: [main]
  # No branch filter on pull_request: a pull request stacked on another branch
  # got no CI at all under `branches: [main]`, which is exactly the branch that
  # most needs it.
  pull_request:

jobs:
  source-gates:
    name: Source gates (comments, layers, logging)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Dependencies the gate scripts import
        run: pip install pyyaml
      - name: Comment and docstring gate
        run: python scripts/check-comments.py
      - name: Backend layer gate
        run: python scripts/check-layers.py
      - name: Type-check scripts reach their files
        run: python scripts/check-type-check.py
      - name: Logging privacy gate
        run: python scripts/check-logging.py
      - name: Connection binding
        run: python scripts/check-connection-binding.py
      - name: Schema response gate
        run: python scripts/check-schema-responses.py
      - name: Test shadowing gate
        run: python scripts/check-test-shadowing.py
      - name: Error body gate
        run: python scripts/check-error-bodies.py
      - name: Gate script tests
        run: make test-gates PYTHON=python

  javascript:
    name: Build & test (JS workspaces + contracts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.15.1
          cache: npm
          cache-dependency-path: |
            package-lock.json
            contracts/package-lock.json
            marketing/package-lock.json
            mobile/package-lock.json
      - name: Install dependencies
        run: make install
      - name: Build dashboard, marketing, contracts
        run: make build
      - name: Design tokens match packages/shared
        run: |
          make generate-tokens
          git diff --exit-code dashboard/src/styles/tokens.css marketing/src/tokens.css
      - name: Type-check workspaces
        run: |
          npm run typecheck

      - name: Mobile imports resolve from mobile/node_modules
        run: npm --prefix mobile run check:resolution

      - name: Lint workspaces
        run: make lint

      - name: Production dependency advisories
        run: |
          npm audit --omit=dev --audit-level=low
          npm --prefix marketing audit --omit=dev --audit-level=low
          npm --prefix contracts audit --omit=dev --audit-level=low
          npm --prefix mobile audit --omit=dev --audit-level=critical

      - name: Workspace, mobile, and contract tests
        run: make test

      - name: Dashboard smoke tests (built bundle, real Chromium)
        run: make smoke PLAYWRIGHT_BROWSER_DEPS=--with-deps

      - name: Smoke test artefacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-smoke-results
          path: |
            dashboard/test-results
            dashboard/playwright-report
          retention-days: 7
          if-no-files-found: ignore

  backend:
    name: Django checks & tests
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only
      STORAGE_BACKEND: local
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ledova
          POSTGRES_USER: ledova
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledova -d ledova" --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Production dependency advisories
        run: pip-audit -r requirements.txt --ignore-vuln PYSEC-2026-1845
      - name: Lint
        run: make lint
      - name: Django system check
        run: python manage.py check
      - name: Migration consistency
        run: python manage.py makemigrations --check --dry-run
      - name: Unit tests (credential-free settings)
        run: python manage.py test --settings=ledova_backend.settings.test
      - name: API type drift gate
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: '5432'
          POSTGRES_DB: ledova
          POSTGRES_USER: ledova
        run: |
          python manage.py migrate --settings=ledova_backend.settings.test_postgres --noinput
          python manage.py spectacular \
            --settings=ledova_backend.settings.test_postgres --file /tmp/ledova-schema.yml
          python ../scripts/check-api-types.py --schema /tmp/ledova-schema.yml
      - name: SQLite migration tests
        run: >-
          python manage.py test authentication.tests.test_email_migration
          --settings=ledova_backend.settings.test_migrations --noinput
      - name: PostgreSQL full suite
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: '5432'
          POSTGRES_DB: ledova
          POSTGRES_USER: ledova
        run: python manage.py test --settings=ledova_backend.settings.test_postgres --noinput
      - name: Request path on the scoped connection (the half the ordinary settings cannot see)
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: '5432'
          POSTGRES_DB: ledova
          POSTGRES_USER: ledova
        run: |
          python manage.py test shared.tests.test_scoped_harness \
            --settings=ledova_backend.settings.test_scoped --noinput
          python manage.py test users.tests.test_account_type_under_the_app_role \
            --settings=ledova_backend.settings.test_scoped --noinput
      - name: Row-level-security roles and catalogue (the half no test can see)
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: '5432'
          POSTGRES_DB: ledova
          POSTGRES_USER: ledova
        run: |
          python manage.py migrate --noinput
          python manage.py check_rls_roles
          python manage.py check_rls_catalogue
      - uses: actions/setup-node@v7
        with:
          node-version: 22.15.1
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - name: Install contract dependencies
        working-directory: contracts
        run: npm ci
      - name: Real-chain test (Hardhat node, deploy core contracts, tokens.tests.test_chain_integration)
        working-directory: .
        run: make chain-test PYTHON=python
      - name: Real-chain test on PostgreSQL (adds the two-worker capital-increase row-lock case)
        working-directory: .
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: '5432'
          POSTGRES_DB: ledova
          POSTGRES_USER: ledova
        run: make chain-test PYTHON=python CHAIN_TEST_SETTINGS=ledova_backend.settings.test_postgres
