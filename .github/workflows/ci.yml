name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  javascript:
    name: Build & test (JS workspaces + contracts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.15.1
          cache: npm
          cache-dependency-path: |
            package-lock.json
            contracts/package-lock.json
            marketing/package-lock.json
            mobile/package-lock.json
      - name: Install dependencies
        run: make install
      - name: Build packages, dashboard, marketing, contracts
        run: make build
      - name: Type-check workspaces
        run: |
          npm run typecheck
          npm --prefix marketing run type-check
          npm --prefix mobile run type-check
      - name: Workspace and contract tests
        run: make test

  backend:
    name: Django checks & tests
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only
      STORAGE_BACKEND: local
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ledova
          POSTGRES_USER: ledova
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledova -d ledova" --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Django system check
        run: python manage.py check
      - name: Migration consistency
        run: python manage.py makemigrations --check --dry-run
      - name: Unit tests (credential-free settings)
        run: python manage.py test --settings=ledova_backend.settings.test
      - name: SQLite migration tests
        run: >-
          python manage.py test authentication.tests.test_v2_email_migration
          --settings=ledova_backend.settings.test_migrations --noinput
      - name: PostgreSQL contract tests
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: '5432'
          POSTGRES_DB: ledova
          POSTGRES_USER: ledova
        run: >-
          python manage.py test tenancy authentication.tests.test_v2_session_models
          authentication.tests.test_v2_session_service_postgres
          authentication.tests.test_v2_email_identity
          authentication.tests.test_v2_email_constraints
          authentication.tests.test_v2_email_migration
          authentication.tests.test_v2_existing_address
          authentication.tests.test_v2_email_writers
          authentication.tests.test_legacy_auth_protocol
          authentication.tests.test_email_verification
          --settings=ledova_backend.settings.test_postgres --noinput
