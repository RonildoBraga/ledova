name: CI

on:
  push:
    branches: [main]
  # No branch filter on pull_request: a pull request stacked on another branch
  # got no CI at all under `branches: [main]`, which is exactly the branch that
  # most needs it.
  pull_request:

jobs:
  source-gates:
    name: Source gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Dependencies the gate scripts import
        run: pip install pyyaml
      - name: Comment and docstring gate
        run: python scripts/check-comments.py
      - name: Backend layer gate
        run: python scripts/check-layers.py
      - name: Type-check scripts reach their files
        run: python scripts/check-type-check.py
      - name: Logging privacy gate
        run: python scripts/check-logging.py
      - name: Connection binding
        run: python scripts/check-connection-binding.py
      - name: Schema response gate
        run: python scripts/check-schema-responses.py
      - name: Test shadowing gate
        run: python scripts/check-test-shadowing.py
      - name: Error body gate
        run: python scripts/check-error-bodies.py
      - name: Documentation gate
        run: python scripts/check-docs.py
      - name: Gate script tests
        run: make test-gates PYTHON=python

  javascript:
    name: Build & test (JS workspaces + contracts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.15.1
          cache: npm
          cache-dependency-path: |
            package-lock.json
            contracts/package-lock.json
            marketing/package-lock.json
            mobile/package-lock.json
      - name: Install dependencies
        run: make install
      - name: Workspace packages do not import themselves
        run: make check-self-imports
      - name: Shared, dashboard and mobile HTTP operation coverage
        run: make check-client-operations
      - name: Client operation coverage artefact
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: client-operation-coverage
          path: /tmp/ledova-client-operations.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Build dashboard, marketing, contracts
        run: make build
      - name: Design tokens match packages/shared
        run: |
          make generate-tokens
          git diff --exit-code dashboard/src/styles/tokens.css marketing/src/tokens.css
      - name: Type-check workspaces
        run: |
          npm run typecheck

      - name: Mobile imports resolve from mobile/node_modules
        run: npm --prefix mobile run check:resolution

      - name: Lint workspaces
        run: |
          make lint
          make check-mobile-test-awaits

      - name: Production dependency advisories
        run: |
          npm audit --omit=dev --audit-level=low
          npm --prefix marketing audit --omit=dev --audit-level=low
          npm --prefix contracts audit --omit=dev --audit-level=low
          npm --prefix mobile audit --omit=dev --audit-level=critical

      - name: Workspace, mobile, and contract tests
        run: make test

      - name: Dashboard smoke tests (built bundle, real Chromium)
        run: |
          # Playwright installs its own Chromium; the runner's Chrome update repo is unused.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
            /etc/apt/sources.list.d/google-chrome.sources
          make smoke PLAYWRIGHT_BROWSER_DEPS=--with-deps

      - name: Smoke test artefacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-smoke-results
          path: |
            dashboard/test-results
            dashboard/playwright-report
          retention-days: 7
          if-no-files-found: ignore

  backend:
    name: Django checks & tests
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only
      STORAGE_BACKEND: local
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
      POSTGRES_DB: ledova
      POSTGRES_USER: ledova
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ledova
          POSTGRES_USER: ledova
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledova -d ledova" --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13.15'
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.txt
            backend/schema/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt -c schema/requirements.txt
      - name: Production dependency advisories
        run: pip-audit -r requirements.txt --ignore-vuln PYSEC-2026-1845
      - name: Lint
        run: make lint
      - name: Django system check
        run: python manage.py check
      - name: Migration consistency
        run: python manage.py makemigrations --check --dry-run
      - name: Shared sign-in throttle (real Redis, fresh and concurrent processes)
        env:
          THROTTLE_TEST_REDIS_URL: redis://127.0.0.1:6379/0
        run: >-
          python manage.py test authentication.tests.redis_throttle
          --settings=ledova_backend.settings.test --noinput
      - name: Shared upload quotas (real Redis, expiry and concurrent processes)
        env:
          UPLOAD_TEST_REDIS_URL: redis://127.0.0.1:6379/0
        run: >-
          python manage.py test shared.tests.redis_uploads
          --settings=ledova_backend.settings.test --noinput
      - name: Start isolated upload scanner
        run: |
          docker run -d --name ledova-upload-clamav --memory 4g --cpus 2 --pids-limit 128 \
            --health-cmd 'clamdscan --ping=1 --config-file=/etc/clamav/clamd.conf' \
            --health-interval 5s --health-timeout 3s --health-retries 60 \
            -v "$GITHUB_WORKSPACE/backend/clamav/clamd.conf:/etc/clamav/clamd.conf:ro" \
            clamav/clamav:1.5.4
          deadline=$((SECONDS + 300))
          until [ "$(docker inspect -f '{{.State.Health.Status}}' ledova-upload-clamav)" = healthy ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              docker logs ledova-upload-clamav
              exit 1
            fi
            sleep 2
          done
          scanner_host=$(docker inspect -f '{{.NetworkSettings.IPAddress}}' ledova-upload-clamav)
          echo "UPLOAD_TEST_CLAMAV_HOST=$scanner_host" >> "$GITHUB_ENV"
      - name: Upload scanning (real signatures, clean documents and EICAR)
        run: >-
          python manage.py test shared.tests.clamav_uploads
          --settings=ledova_backend.settings.test --noinput
      - name: Remove isolated upload scanner
        if: always()
        run: docker rm -f -v ledova-upload-clamav || true
      - name: Generate API schema and compare registered operation coverage
        id: generate-schema
        shell: bash
        run: |
          python manage.py migrate --settings=ledova_backend.settings.test_postgres --noinput
          python manage.py export_api_schema --settings=ledova_backend.settings.test_postgres \
            --file /tmp/ledova-schema.json --report /tmp/ledova-schema-environment.json \
            2>&1 | tee /tmp/ledova-schema-diagnostics.log
      - name: Complete API schema snapshot comparison
        run: >-
          python ../scripts/check-api-schema.py --schema /tmp/ledova-schema.json
          --report /tmp/ledova-schema-comparison.json
      - name: API type and trading event drift gate
        if: ${{ !cancelled() && steps.generate-schema.outcome == 'success' }}
        run: python ../scripts/check-api-types.py --schema /tmp/ledova-schema.json
      - name: Generated schema, diagnostics, environment and comparison
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-schema-contract
          path: |
            /tmp/ledova-schema.json
            /tmp/ledova-schema-diagnostics.log
            /tmp/ledova-schema-environment.json
            /tmp/ledova-schema-comparison.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Full suite
        run: python manage.py test --settings=ledova_backend.settings.test --parallel 4 --noinput
      - name: The whole suite behind the policies (the app role on one connection)
        run: >-
          python manage.py test
          --settings=ledova_backend.settings.test_behind_the_policies --parallel 4 --noinput
      - name: Request path on the scoped connection (the half the ordinary settings cannot see)
        run: >-
          python manage.py test --settings=ledova_backend.settings.test_scoped
          --require-scoped-coverage --noinput
      - name: Row-level-security roles and catalogue (the half no test can see)
        run: |
          python manage.py migrate --noinput
          python manage.py check_rls_roles
          python manage.py check_rls_catalogue
      - uses: actions/setup-node@v7
        with:
          node-version: 22.15.1
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - name: Install contract dependencies
        working-directory: contracts
        run: npm ci
      - name: Real-chain test (Hardhat node, deploy core contracts, tokens.tests.test_chain_integration)
        working-directory: .
        run: make chain-test PYTHON=python
      - name: Real-chain test on PostgreSQL (adds the two-worker capital-increase row-lock case)
        working-directory: .
        run: make chain-test PYTHON=python CHAIN_TEST_SETTINGS=ledova_backend.settings.test_postgres
      - name: Bitcoin submission pipeline (isolated regtest and PostgreSQL)
        working-directory: .
        run: python scripts/test-bitcoin-chain.py
