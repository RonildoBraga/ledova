name: ledova

# Every service built from ./backend gets the same forced settings. STORAGE_BACKEND=local is only
# servable while DEBUG is true -- ledova_backend/environment.py refuses that pair at the ASGI/WSGI
# import -- so the two are set together here instead of being left to ./backend/.env, which this
# file declares optional. These are `environment:` entries, so they also win over that file.
x-backend-environment: &backend-environment
  POSTGRES_HOST: postgres
  REDIS_URL: redis://redis:6379/0
  STORAGE_BACKEND: local
  DEBUG: "true"

services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # shared/0003 creates ledova_app and ledova_operator with LOGIN and no password,
      # deliberately: a credential does not belong in a migration. Without this the
      # image initdb's with scram-sha-256, the two roles can never authenticate over
      # the compose bridge, and the stack dies at the first post-migrate ORM call.
      # docs/OPERATIONS.md says local work uses trust as CI does; this is where it is
      # applied. initdb reads it on FIRST start only - an existing volume needs the
      # ALTER ROLE recipe in that section instead.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment: *backend-environment
    command: sh -c "python manage.py migrate --noinput && python manage.py check_rls_roles && python manage.py sync_monitoring_rules && python manage.py sync_procedure_templates && python manage.py asset_sync --seed-only"
    volumes:
      - media_data:/usr/src/app/media
      - private_media_data:/usr/src/app/private-media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment: *backend-environment
    command: uvicorn ledova_backend.asgi:application --host 0.0.0.0 --port 8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - media_data:/usr/src/app/media
      - private_media_data:/usr/src/app/private-media
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment: *backend-environment
    command: python manage.py procrastinate worker --queues=default,builtin
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - media_data:/usr/src/app/media
      - private_media_data:/usr/src/app/private-media
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  dashboard:
    build:
      context: .
      dockerfile: dashboard/.deployment/Dockerfile.dev
    env_file:
      - path: ./dashboard/.env
        required: false
    ports:
      - "127.0.0.1:5174:5174"
    depends_on:
      - backend

  marketing:
    build:
      context: ./marketing
      dockerfile: .deployment/Dockerfile.dev
    env_file:
      - path: ./marketing/.env
        required: false
    ports:
      - "127.0.0.1:5173:5173"

volumes:
  media_data:
  private_media_data:
  postgres_data:
  redis_data:
